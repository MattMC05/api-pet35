spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
dominio.openapi.dev-url=http://localhost:8080
dominio.openapi.prod-url=http://meudominio.com.br/sistema
auth.jwt-secret=${AUTH.JWT_SECRET:minha_chave_super_secreta_padrao_para_oficina_2026_xpto_com_mais_de_32_bytes}
auth.jwt-expiration-miliseg=86400000