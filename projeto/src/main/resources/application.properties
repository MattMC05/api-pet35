spring.application.name=projetoapi
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.user.name=
spring.security.user.password=

# Configuração SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Coloque o seu e-mail do Gmail
spring.mail.username=${USUARIO_EMAIL}
spring.mail.password=${SENHA_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
dominio.openapi.dev-url=http://localhost:8080
dominio.openapi.prod-url=https://meudominio.com.br/sistema
auth.jwt-secret=${AUTH.JWT_SECRET}
auth.jwt-expiration-miliseg=86400000