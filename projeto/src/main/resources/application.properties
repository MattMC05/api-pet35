spring.application.name=projeto
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.user.name=
spring.security.user.password=

# Configuração SMTP Mailtrap
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${USUARIO_EMAIL}
spring.mail.password=${SENHA_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
dominio.openapi.dev-url=http://localhost:8080
dominio.openapi.prod-url=http://meudominio.com.br/sistema
auth.jwt-secret=${AUTH.JWT_SECRET}
auth.jwt-expiration-miliseg=86400000
