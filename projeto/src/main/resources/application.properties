spring.application.name=projetoapi
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${USUARIO_EMAIL}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
dominio.openapi.dev-url=http://localhost:8080
dominio.openapi.prod-url=meudominio.com.br/sistema
jwt.secret=${AUTH.JWT_SECRET}
jwt.expiration-miliseg=86400000